<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1080" viewBox="0 0 1120 1080">
<title>Proposed R7 explanation view in ArchiMate 4</title>
<desc>Application component realizes a wording service that serves the explanation process. That process realizes an explanation capability and a receipt-meaning requirement. This is a proposed target, not evidence of implementation.</desc>
<defs><marker id="realizes" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto"><path d="M1 1 L13 7 L1 13 Z" fill="white" stroke="#172a3a" stroke-width="1.2"/></marker><marker id="serves" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto"><path d="M1 1 L13 7 L1 13" fill="none" stroke="#172a3a" stroke-width="1.2"/></marker></defs>
<rect width="1120" height="1080" fill="white"/>
<g font-family="Arial, sans-serif" fill="#172a3a" font-size="25">
<path d="M420 300 L280 180" fill="none" stroke="#172a3a" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#realizes)"/>
<text x="275" y="245" text-anchor="middle" font-size="23">realization</text>
<path d="M700 300 L840 180" fill="none" stroke="#172a3a" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#realizes)"/>
<text x="845" y="245" text-anchor="middle" font-size="23">realization</text>
<path d="M560 430 L560 550" fill="none" stroke="#172a3a" stroke-width="2.5" marker-end="url(#serves)"/>
<text x="660" y="498" text-anchor="middle" font-size="23">serving</text>
