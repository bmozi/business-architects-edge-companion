<text x="665" y="735" text-anchor="middle" font-size="23">realization</text>
<polygon points="64,60 510,60 510,166 496,180 50,180 50,74" fill="#ede8f2" stroke="#172a3a" stroke-width="2.5"/>
<text x="280.0" y="89" text-anchor="middle" font-size="20">«Requirement»</text>
<text x="280.0" y="124" text-anchor="middle">Receipt explanation must</text>
<text x="280.0" y="153" text-anchor="middle">preserve R7 meaning</text>
<rect x="610" y="60" width="460" height="120" rx="14" fill="#f5efdd" stroke="#172a3a" stroke-width="2.5"/>
<text x="840.0" y="89" text-anchor="middle" font-size="20">«Capability»</text>
<text x="840.0" y="124" text-anchor="middle">AI drafting application</text>
<rect x="300" y="300" width="520" height="130" rx="14" fill="#f5efdd" stroke="#172a3a" stroke-width="2.5"/>
<text x="560.0" y="329" text-anchor="middle" font-size="20">«Process»</text>
<text x="560.0" y="364" text-anchor="middle">Check approved source</text>
<text x="560.0" y="393" text-anchor="middle">and explain receipt</text>
<rect x="300" y="550" width="520" height="110" rx="50" fill="#e7f0f3" stroke="#172a3a" stroke-width="2.5"/>
<text x="560.0" y="579" text-anchor="middle" font-size="20">«Service»</text>
<text x="560.0" y="614" text-anchor="middle">Presenting approved</text>
<text x="560.0" y="643" text-anchor="middle">receipt wording</text>
<rect x="300" y="780" width="520" height="110" rx="0" fill="#e7f0f3" stroke="#172a3a" stroke-width="2.5"/>
<rect x="288" y="800" width="28" height="18" fill="#e7f0f3" stroke="#172a3a" stroke-width="2"/>
<rect x="288" y="828" width="28" height="18" fill="#e7f0f3" stroke="#172a3a" stroke-width="2"/>
<text x="560.0" y="809" text-anchor="middle" font-size="20">«ApplicationComponent»</text>
